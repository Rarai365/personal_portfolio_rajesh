<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Cartoon tech guy with headset and laptop">
  <defs>
    <clipPath id="circle"><circle cx="200" cy="200" r="200"/></clipPath>
  </defs>

  <!-- Background disc (the single orange shape of the palette) -->
  <circle cx="200" cy="200" r="200" fill="#d8401f"/>

  <g clip-path="url(#circle)">
    <!-- Floating tech doodles -->
    <g fill="none" stroke="#efede8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <!-- cloud -->
      <path d="M62 128c-14 0-22-10-20-21 2-10 11-16 21-14 4-12 16-19 29-16 11 3 17 11 18 19 11 0 19 8 18 17-1 9-8 15-18 15z"/>
      <!-- wifi -->
      <g transform="translate(-30 14)">
        <path d="M318 96a46 46 0 0 1 56 0M329 112a30 30 0 0 1 34 0"/>
        <circle cx="346" cy="128" r="3" fill="#efede8"/>
      </g>
      <!-- code brackets -->
      <path d="M48 218l-16 14 16 14M84 218l16 14-16 14M72 214l-12 36"/>
    </g>

    <!-- Hoodie / shoulders -->
    <path d="M40 410C40 330 105 296 200 296s160 34 160 114z" fill="#141414"/>
    <!-- Hood collar -->
    <ellipse cx="200" cy="303" rx="66" ry="24" fill="#2b2b2b"/>
    <!-- Hoodie strings -->
    <path d="M176 318v34M224 318v34" stroke="#efede8" stroke-width="4" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="176" y="250" width="48" height="58" rx="20" fill="#c98c5e"/>

    <!-- Ears -->
    <circle cx="124" cy="196" r="15" fill="#d99a6a"/>
    <circle cx="276" cy="196" r="15" fill="#d99a6a"/>

    <!-- Head -->
    <ellipse cx="200" cy="186" rx="78" ry="88" fill="#e0a77a"/>

    <!-- Hair -->
    <path d="M122 178C112 100 160 78 206 82c52 3 84 34 72 96-14-34-40-50-78-50s-62 16-78 50z" fill="#141414"/>
    <path d="M150 112c14-22 48-30 74-22" fill="none" stroke="#2b2b2b" stroke-width="6" stroke-linecap="round"/>

    <!-- Headset: band, ear cups and mic -->
    <path d="M116 188C108 86 292 86 284 188" fill="none" stroke="#12a699" stroke-width="10" stroke-linecap="round"/>
    <rect x="102" y="176" width="24" height="52" rx="11" fill="#12a699"/>
    <rect x="274" y="176" width="24" height="52" rx="11" fill="#12a699"/>
    <path d="M286 222c4 40-22 58-52 54" fill="none" stroke="#141414" stroke-width="5" stroke-linecap="round"/>
    <circle cx="232" cy="276" r="8" fill="#141414"/>

    <!-- Glasses -->
    <rect x="138" y="190" width="56" height="42" rx="15" fill="#efede8" fill-opacity="0.35" stroke="#141414" stroke-width="6"/>
    <rect x="206" y="190" width="56" height="42" rx="15" fill="#efede8" fill-opacity="0.35" stroke="#141414" stroke-width="6"/>
    <path d="M194 205h12" stroke="#141414" stroke-width="6" stroke-linecap="round"/>

    <!-- Eyes, brows, nose, smile -->
    <circle cx="166" cy="212" r="6" fill="#141414"/>
    <circle cx="234" cy="212" r="6" fill="#141414"/>
    <path d="M148 178q18-10 36-2M216 176q18-8 36 2" fill="none" stroke="#141414" stroke-width="5" stroke-linecap="round"/>
    <path d="M200 218q-6 14 4 18" fill="none" stroke="#b97d50" stroke-width="4" stroke-linecap="round"/>
    <path d="M174 250q26 24 52 0" fill="none" stroke="#141414" stroke-width="5" stroke-linecap="round"/>

    <!-- Laptop (back of the lid faces us) -->
    <rect x="104" y="316" width="192" height="110" rx="12" fill="#efede8"/>
    <rect x="104" y="316" width="192" height="12" rx="6" fill="#d8d5cc"/>
    <circle cx="200" cy="366" r="13" fill="#12a699"/>
    <!-- Hands gripping the lid -->
    <ellipse cx="104" cy="334" rx="19" ry="15" fill="#e0a77a"/>
    <ellipse cx="296" cy="334" rx="19" ry="15" fill="#e0a77a"/>
  </g>
</svg>
